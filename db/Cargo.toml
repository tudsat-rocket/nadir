[package]
name = "db"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
macros = { workspace = true }

chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

mavspec = { workspace = true, features = ["rust-dialects", "dlct-ardupilotmega"] }
mavinspect = { version = "0.6.6" }
rapid-dialect = { workspace = true }

puffin = { git = "https://github.com/EmbarkStudios/puffin" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The bundled amalgamation needs a C toolchain with a wasm sysroot, which does not exist for
# wasm32-unknown-unknown. sqlite-wasm-rs supplies the same C API compiled for the target instead.
rusqlite = { version = "0.37", default-features = false, features = ["chrono"] }
sqlite-wasm-rs = "0.5.5"

[lints]
workspace = true
