[package]
name = "nadir"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nadir-core = { workspace = true }

chrono = { workspace = true }
tracing = { workspace = true }
web-time = "1.1"
tracing-subscriber = { workspace = true }
convert_case = { workspace = true }

mavspec = { workspace = true }
rapid-dialect = { workspace = true }

egui = { workspace = true }
egui_plot = { workspace = true }
egui_extras = { workspace = true }
egui_tiles = "0.15"
egui-notify = "0.22"
egui_tracing = "0.3"
walkers = "0.55"
walkers_extras = "0.55"

# profiling feature
puffin = { git = "https://github.com/EmbarkStudios/puffin", rev = "7e08a53", optional = true }
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin", rev = "7e08a53", optional = true }
nalgebra = "0.35.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, default-features = true }
# One file picker for desktop and web: the wasm backend is an `<input type="file">` behind the same
# `AsyncFileDialog`. Android has no backend and does without a picker entirely.
rfd = "0.17.2"

# eframe rejects its default accesskit alongside `android-native-activity` at compile time.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["wgpu", "android-native-activity", "default_fonts"] }
# Not used from Rust: feature-unifies eframe's own wgpu onto the GL backend. Keep the major in step
# with eframe's, or this silently stops applying.
wgpu = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
maviola = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros"] }
log = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
mavio = { version = "0.5.10", default-features = false, features = ["alloc", "dlct-common", "dlct-ardupilotmega"] }
wasm-bindgen-futures = "0.4"
# Without this a panic reaches the console as a bare `RuntimeError: unreachable`, with no location.
console_error_panic_hook = "0.1.7"

[features]
default = []
profiling = ["dep:puffin", "dep:puffin_egui"]

[lints]
workspace = true
