plugins {
    id 'com.android.application'
}

android {
    namespace 'space.tudsat.nadir'
    // Must match an installed platform under `platforms/`.
    compileSdk 37
    buildToolsVersion '37.0.0'

    // Checked in so an APK built on one machine can replace one built on another; AGP's per-user
    // debug keystore makes those signatures incompatible.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "space.tudsat.nadir"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
